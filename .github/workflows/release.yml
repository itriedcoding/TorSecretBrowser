name: Build installers

# Produces real, downloadable installers:
#   - Windows  : NSIS installer  (TorSecretBrowser-win-x64-setup.exe)
#   - macOS    : DMG (Intel + Apple Silicon)
#   - Linux    : AppImage
# Each build downloads the official Tor Expert Bundle for its platform and
# bundles it, so the installed app works offline with no extra setup.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows x64,  os: windows-latest, args: '',        artifact: windows }
          - { label: Linux x64,    os: ubuntu-latest,  args: '',        artifact: linux }
          - { label: macOS Intel,  os: macos-latest,   args: '--x64',   artifact: macos-x64 }
          - { label: macOS ARM64,  os: macos-latest,   args: '--arm64', artifact: macos-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download Tor for this platform
        run: npm run fetch-tor

      # Code signing is fully wired but OPT-IN: each step below is a no-op
      # unless the corresponding repository secrets exist. Without them the
      # build is simply unsigned (current state) and everything else works.
      # Secrets needed to activate:
      #   Windows: WIN_CERT_PFX_BASE64 (base64 .pfx) + WIN_CERT_PASSWORD
      #   macOS:   MAC_CERT_PFX_BASE64 (base64 .p12 of a Developer ID Application
      #            certificate) + MAC_CERT_PASSWORD + APPLE_ID +
      #            APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (notarization)
      - name: Configure Windows code signing (optional)
        if: runner.os == 'Windows' && secrets.WIN_CERT_PFX_BASE64 != ''
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'tsb-signing-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:TSB_WIN_PFX))
          "CSC_LINK=$pfx" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:TSB_WIN_PASS" >> $env:GITHUB_ENV
        env:
          TSB_WIN_PFX: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          TSB_WIN_PASS: ${{ secrets.WIN_CERT_PASSWORD }}

      - name: Configure macOS signing + notarization (optional)
        if: runner.os == 'macOS' && secrets.MAC_CERT_PFX_BASE64 != ''
        run: |
          PFX="$RUNNER_TEMP/tsb-signing-cert.p12"
          echo "$TSB_MAC_PFX" | base64 --decode > "$PFX"
          echo "CSC_LINK=$PFX" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$TSB_MAC_PASS" >> "$GITHUB_ENV"
          echo "APPLE_ID=$TSB_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$TSB_APPLE_PASS" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TSB_TEAM_ID" >> "$GITHUB_ENV"
        env:
          TSB_MAC_PFX: ${{ secrets.MAC_CERT_PFX_BASE64 }}
          TSB_MAC_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
          TSB_APPLE_ID: ${{ secrets.APPLE_ID }}
          TSB_APPLE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TSB_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Never search the keychain for identities; signing happens only via
          # the explicit CSC_LINK certificate configured above (or none).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer(s)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum *.exe *.dmg *.AppImage *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: false
